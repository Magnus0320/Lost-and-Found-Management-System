<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Log in — Campus Lost &amp; Found</title>
  <script>
    /* Apply a saved theme before first paint, so it never flashes. See js/theme.js. */
    try { var t = localStorage.getItem("lf_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="/app/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@600;700&display=swap">
  <link rel="stylesheet" href="/app/css/styles.css">
</head>
<body>
  <header class="site-header" data-nav></header>
  <main id="main" class="narrow">
    <p class="eyebrow">Front desk</p>
    <h1>Log in</h1>
    <p class="sub">Use your campus email and password.</p>
    <div class="panel ticket">
      <p class="stub">Visitor pass</p>
      <div class="notice" data-notice hidden></div>
      <div class="banner" data-error-banner hidden></div>
      <form data-login-form novalidate>
        <label>Email
          <input name="email" type="email" autocomplete="username" required data-testid="login-email">
          <span class="field-error" data-field-error="email"></span>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required data-testid="login-password">
          <span class="field-error" data-field-error="password"></span>
        </label>
        <button type="submit" data-testid="login-submit">Log in</button>
      </form>
      <p class="muted small-text" style="margin:18px 0 0">
        No account? <a href="/app/register.html">Register</a> ·
        <a href="/app/reset-request.html">Forgot password?</a>
      </p>
    </div>
  </main>

  <script type="module" src="/app/js/nav.js"></script>
  <script type="module" src="/app/js/pages/login.js"></script>
</body>
</html>
