<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email — Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="/app/css/styles.css">
</head>
<body>
  <header class="site-header" data-nav></header>
  <main class="narrow">
    <h1>Verify your email</h1>
    <p class="sub">Enter the one-time code sent to your address.</p>
    <div class="panel">
      <div class="dev-otp" data-dev-otp hidden></div>
      <div class="notice" data-notice hidden></div>
      <div class="banner" data-error-banner hidden></div>
      <form data-verify-form novalidate>
        <label>Email
          <input name="email" type="email" required data-testid="verify-email">
          <span class="field-error" data-field-error="email"></span>
        </label>
        <label>One-time code
          <input name="otp" inputmode="numeric" maxlength="8" required data-testid="verify-otp">
          <span class="field-error" data-field-error="otp"></span>
        </label>
        <button type="submit" data-testid="verify-submit">Verify</button>
      </form>
    </div>
  </main>
  <script type="module" src="/app/js/nav.js"></script>
  <script type="module" src="/app/js/pages/verify.js"></script>
</body>
</html>
