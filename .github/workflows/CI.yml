name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lostfound
          POSTGRES_PASSWORD: lostfound
          POSTGRES_DB: lostfound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lostfound -d lostfound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://lostfound:lostfound@localhost:5432/lostfound
      SECRET_KEY: ci-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Fail on syntax errors and undefined names.
          flake8 app tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests scripts --count --exit-zero --max-complexity=12 --max-line-length=110 --statistics

      - name: Assert every route is typed
        run: python scripts/audit_routes.py
        env:
          DATABASE_URL: postgresql://lostfound:lostfound@localhost:5432/lostfound

      - name: Verify migrations build the schema from empty
        run: |
          alembic upgrade head
          alembic current
        env:
          DATABASE_URL: postgresql://lostfound:lostfound@localhost:5432/lostfound

      - name: Verify migrations round-trip (downgrade then upgrade)
        run: |
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://lostfound:lostfound@localhost:5432/lostfound

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and boot the full stack
        run: docker compose up --build -d

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker compose logs; exit 1

      - name: Smoke-test the running stack
        run: |
          pip install httpx
          python scripts/smoke_http.py http://localhost:8000

      - name: Browser end-to-end test (real stack, no mocks)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/e2e_test.py

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: scripts/e2e_screenshots/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
